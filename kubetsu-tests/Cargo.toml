[package]
name = "kubetsu-tests"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
kubetsu = { path = "../kubetsu" }
kubetsu-serde = { path = "../kubetsu-serde" }
kubetsu-fake = { path = "../kubetsu-fake" }
kubetsu-sqlx = { path = "../kubetsu-sqlx", features = ["sqlite"] }
serde_json = "1"
fake = { version = "5", features = ["derive", "uuid"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "macros", "sqlite", "uuid"] }
tokio = { version = "1", features = ["macros", "rt"] }
uuid = { version = "1", features = ["v7", "serde"] }
ulid = { version = "3", features = ["serde"] }
