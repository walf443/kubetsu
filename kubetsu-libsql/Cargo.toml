[package]
name = "kubetsu-libsql"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

authors = ["Keiji Yoshimi"]

license = "MIT"

readme = "README.md"

description = "libsql support for kubetsu ID types"

keywords = ["libsql", "turso", "newtype", "id"]

homepage = "https://github.com/walf443/kubetsu"
repository = "https://github.com/walf443/kubetsu.git"

[dependencies]
kubetsu = { version = "0.10", path = "../kubetsu" }
libsql = { version = "0.9", default-features = false }

[dev-dependencies]
kubetsu-serde = { path = "../kubetsu-serde" }
kubetsu-fake = { path = "../kubetsu-fake" }
serde_json = "1"
fake = "5"
libsql = { version = "0.9", default-features = false, features = ["core"] }
tokio = { version = "1", features = ["macros", "rt"] }
uuid = { version = "1" }
