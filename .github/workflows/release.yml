name: Release

on:
  push:
    tags:
      - "v*"
      - "kubetsu-serde-v*"
      - "kubetsu-fake-v*"
      - "kubetsu-sqlx-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Generate crates.io token
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
        id: auth

      - name: Publish kubetsu to crates.io
        if: startsWith(github.ref_name, 'v')
        run: cargo publish -p kubetsu
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish kubetsu-serde to crates.io
        if: startsWith(github.ref_name, 'kubetsu-serde-v')
        run: cargo publish -p kubetsu-serde
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish kubetsu-fake to crates.io
        if: startsWith(github.ref_name, 'kubetsu-fake-v')
        run: cargo publish -p kubetsu-fake
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish kubetsu-sqlx to crates.io
        if: startsWith(github.ref_name, 'kubetsu-sqlx-v')
        run: cargo publish -p kubetsu-sqlx
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
