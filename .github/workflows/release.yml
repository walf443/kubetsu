name: Release

on:
  push:
    tags:
      - "v*"
      - "kubetsu-serde-v*"
      - "kubetsu-fake-v*"
      - "kubetsu-sqlx-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Generate crates.io token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish kubetsu to crates.io
        if: startsWith(github.ref_name, 'v')
        run: cargo publish -p kubetsu
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish kubetsu-serde to crates.io
        if: startsWith(github.ref_name, 'kubetsu-serde-v')
        run: cargo publish -p kubetsu-serde
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish kubetsu-fake to crates.io
        if: startsWith(github.ref_name, 'kubetsu-fake-v')
        run: cargo publish -p kubetsu-fake
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish kubetsu-sqlx to crates.io
        if: startsWith(github.ref_name, 'kubetsu-sqlx-v')
        run: cargo publish -p kubetsu-sqlx
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
